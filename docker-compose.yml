services:
  db:
    image: postgres:16-alpine
    restart: always
    mem_limit: 1g
    environment:
      POSTGRES_DB: veille
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d veille"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    restart: always
    mem_limit: 1g
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    mem_limit: 1g
    volumes:
      - app_data:/data
      - ./backend/app:/app/app:ro
      - ./backend/openssl-legacy.cnf:/etc/ssl/legacy-openssl.cnf:ro
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/veille
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-in-production
      GEORISQUES_API_TOKEN: ${GEORISQUES_API_TOKEN:-eyJhbGciOiJIUzI1NiJ9.eyJub20iOiJQRUNPVVQiLCJwcmVub20iOiJMdWNhcyBGZXJuYW5kIiwiZW1haWwiOiJsdWNhc3BlY291dEBnbWFpbC5jb20iLCJleHAiOjE4MDQ2MzY4MDAsImlhdCI6MTc3MzE0MDE1NX0.QZwqLatikYGopYKcUh3JhZHKE-xGAMlfrcAxy1jm980}
      RTE_ECOWATT_B64: MzZlODVlNmEtMThmMi00MWUxLWEwZTItNjIyMDE3MzliMzNjOjAzMGExNmI5LWU2ZWItNDEwOC05ZDA4LTI3ZmQzYTdjMDkwZg==
      RTE_CONSUMPTION_B64: MmU4YzhhMTQtMTcxMS00OTlmLWE5ZjItMmFlZWU0ODMzY2MzOjE0YjkxMWZhLTFmNmYtNDA1NC1hNjQ5LTc4MGMwZDM2YjQzZA==
      FIRMS_MAP_KEY: e851c321ada39283c359d8df6c70989d
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
      LDAP_ENABLED: ${LDAP_ENABLED:-true}
      LDAP_URL: ${LDAP_URL:-ldap://lldap:3890}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-uid=admin,ou=people,dc=apc38,dc=local}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_USER_BASE_DN: ${LDAP_USER_BASE_DN:-ou=people,dc=apc38,dc=local}
      LDAP_USER_FILTER: "(|(uid={username})(mail={username}))"
      LDAP_USER_DN_TEMPLATE: ${LDAP_USER_DN_TEMPLATE:-}
      LDAP_ROLE_DEFAULT: ${LDAP_ROLE_DEFAULT:-visiteur}
      LDAP_MUNICIPALITY_ATTR: ${LDAP_MUNICIPALITY_ATTR:-}
      LDAP_GROUP_BASE_DN: ${LDAP_GROUP_BASE_DN:-ou=groups,dc=apc38,dc=local}
      LDAP_GROUP_FILTER: "(member={user_dn})"
      LDAP_GROUP_NAME_ATTR: ${LDAP_GROUP_NAME_ATTR:-cn}
      LDAP_GROUP_REQUIRED: ${LDAP_GROUP_REQUIRED:-alerte}
      LDAP_GROUP_ROLE_MAP: ${LDAP_GROUP_ROLE_MAP:-alerte:ope}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - lldap_ldap_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\" 2>/dev/null && echo ok"]
      interval: 8s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: always
    mem_limit: 512m
    volumes:
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "1182:80"

volumes:
  db_data:
  redis_data:
  app_data:

networks:
  lldap_ldap_net:
    external: true
