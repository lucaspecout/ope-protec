services:
  db:
    image: postgres:16-alpine
    restart: always
    mem_limit: 1g
    environment:
      POSTGRES_DB: veille
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d veille"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    restart: always
    mem_limit: 1g
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    mem_limit: 2g
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/veille
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-in-production
      GEORISQUES_API_TOKEN: ${GEORISQUES_API_TOKEN:-eyJhbGciOiJIUzI1NiJ9.eyJub20iOiJQRUNPVVQiLCJwcmVub20iOiJMdWNhcyBGZXJuYW5kIiwiZW1haWwiOiJsdWNhc3BlY291dEBnbWFpbC5jb20iLCJleHAiOjE4MDQ2MzY4MDAsImlhdCI6MTc3MzE0MDE1NX0.QZwqLatikYGopYKcUh3JhZHKE-xGAMlfrcAxy1jm980}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: always
    mem_limit: 512m
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "1182:80"

volumes:
  db_data:
  redis_data:
