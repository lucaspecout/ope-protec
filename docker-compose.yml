services:
  db:
    image: postgres:16.15-alpine
    restart: always
    mem_limit: ${DB_MEMORY_LIMIT:-768m}
    mem_reservation: ${DB_MEMORY_RESERVATION:-384m}
    cpus: ${DB_CPU_LIMIT:-1.0}
    command: ["postgres", "-c", "shared_buffers=192MB", "-c", "effective_cache_size=512MB", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=64MB"]
    environment:
      POSTGRES_DB: veille
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/prepare_security_env.py}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d veille"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Pin the current stable release instead of silently changing :latest.
    image: redis:8.10.2
    restart: always
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    mem_reservation: ${REDIS_MEMORY_RESERVATION:-96m}
    cpus: ${REDIS_CPU_LIMIT:-0.50}
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "160mb", "--maxmemory-policy", "allkeys-lru", "--save", "60", "1000"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    mem_limit: ${API_MEMORY_LIMIT:-768m}
    mem_reservation: ${API_MEMORY_RESERVATION:-384m}
    cpus: ${API_CPU_LIMIT:-1.5}
    pids_limit: 256
    volumes:
      - app_data:/data
      - ./backend/app:/app/app:ro
      - ./backend/openssl-legacy.cnf:/etc/ssl/legacy-openssl.cnf:ro
    environment:
      DATABASE_URL: ${DATABASE_URL:?Run python scripts/prepare_security_env.py}
      REDIS_URL: redis://redis:6379/0
      DB_POOL_SIZE: ${DB_POOL_SIZE:-3}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-3}
      EXTERNAL_FETCH_WORKERS: ${EXTERNAL_FETCH_WORKERS:-6}
      BACKGROUND_REFRESH_WORKERS: ${BACKGROUND_REFRESH_WORKERS:-4}
      API_CREDENTIALS_KEY_PATH: ${API_CREDENTIALS_KEY_PATH:-/data/api_credentials.key}
      METEO_FRANCE_API_KEY: ${METEO_FRANCE_API_KEY:-}
      METEO_FRANCE_OBSERVATIONS_API_KEY: ${METEO_FRANCE_OBSERVATIONS_API_KEY:-}
      METEO_FRANCE_RADAR_API_KEY: ${METEO_FRANCE_RADAR_API_KEY:-}
      METEO_FRANCE_ACCESS_TOKEN: ${METEO_FRANCE_ACCESS_TOKEN:-}
      METEO_FRANCE_STATION_IDS: ${METEO_FRANCE_STATION_IDS:-}
      METEO_FRANCE_STATION_LIMIT: ${METEO_FRANCE_STATION_LIMIT:-40}
      INSEE_POPULATION_CSV_URL: ${INSEE_POPULATION_CSV_URL:-https://www.insee.fr/fr/statistiques/fichier/8735162/Filosofi2021_carreaux_200m_csv.zip}
      INSEE_POPULATION_LOCAL_PATH: ${INSEE_POPULATION_LOCAL_PATH:-}
      INDUSTRIAL_SITES_CSV_URL: ${INDUSTRIAL_SITES_CSV_URL:-}
      SECRET_KEY: ${SECRET_KEY:?Run python scripts/prepare_security_env.py}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-15728640}
      GEORISQUES_API_TOKEN: ${GEORISQUES_API_TOKEN:-}
      RTE_ECOWATT_B64: ${RTE_ECOWATT_B64:-}
      RTE_CONSUMPTION_B64: ${RTE_CONSUMPTION_B64:-}
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
      LDAP_ENABLED: ${LDAP_ENABLED:-true}
      LDAP_URL: ${LDAP_URL:-ldap://lldap:3890}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-uid=admin,ou=people,dc=apc38,dc=local}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_USER_BASE_DN: ${LDAP_USER_BASE_DN:-ou=people,dc=apc38,dc=local}
      LDAP_USER_FILTER: "(|(uid={username})(mail={username}))"
      LDAP_USER_DN_TEMPLATE: ${LDAP_USER_DN_TEMPLATE:-}
      LDAP_ROLE_DEFAULT: ${LDAP_ROLE_DEFAULT:-visiteur}
      LDAP_MUNICIPALITY_ATTR: ${LDAP_MUNICIPALITY_ATTR:-}
      LDAP_GROUP_BASE_DN: ${LDAP_GROUP_BASE_DN:-ou=groups,dc=apc38,dc=local}
      LDAP_GROUP_FILTER: "(member={user_dn})"
      LDAP_GROUP_NAME_ATTR: ${LDAP_GROUP_NAME_ATTR:-cn}
      LDAP_GROUP_REQUIRED: ${LDAP_GROUP_REQUIRED:-alerte}
      LDAP_GROUP_ROLE_MAP: ${LDAP_GROUP_ROLE_MAP:-alerte:ope}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - lldap_ldap_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\" 2>/dev/null && echo ok"]
      interval: 8s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: always
    mem_limit: ${WEB_MEMORY_LIMIT:-128m}
    mem_reservation: ${WEB_MEMORY_RESERVATION:-32m}
    cpus: ${WEB_CPU_LIMIT:-0.50}
    volumes:
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "1182:80"

volumes:
  db_data:
  redis_data:
  app_data:

networks:
  lldap_ldap_net:
    external: true
