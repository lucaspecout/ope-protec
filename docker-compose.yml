services:
  db:
    image: postgres:16-alpine
    restart: always
    mem_limit: 1g
    environment:
      POSTGRES_DB: veille
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d veille"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    mem_limit: 1g
    cpus: 0.75
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    mem_limit: 1g
    cpus: 1.5
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/veille
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      EXTERNAL_FETCH_WORKERS: ${EXTERNAL_FETCH_WORKERS:-3}
      EXTERNAL_REFRESH_INTERVAL_SECONDS: ${EXTERNAL_REFRESH_INTERVAL_SECONDS:-900}
      EXTERNAL_REFRESH_ENABLED: ${EXTERNAL_REFRESH_ENABLED:-true}
      GEORISQUES_API_TOKEN: ${GEORISQUES_API_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: always
    mem_limit: 512m
    cpus: 0.75
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    ports:
      - "1182:80"

volumes:
  db_data:
  redis_data:
