upstream api_backend {
  server api:8000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;

  # Compression gzip pour les réponses JSON et statiques
  gzip on;
  gzip_types application/json application/javascript text/css text/plain application/xml;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_vary on;
  gzip_proxied any;

  # Timeouts proxy globaux
  proxy_connect_timeout 10s;
  proxy_send_timeout    30s;
  proxy_read_timeout    120s;

  location ~ ^/(health|auth|dashboard|weather|municipalities|events|logs|reports|shares|external|public|api|supervision|operations|map)(/|$) {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/(docs|openapi.json|redoc)$ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
  }

  location = /map/annotations/stream {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "no-cache" always;
  }

  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location ~* \.(js|css)$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
