upstream api_backend {
  server api:8000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  open_file_cache max=1000 inactive=30s;
  open_file_cache_valid 60s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;

  # Compression gzip pour les réponses JSON et statiques
  gzip on;
  gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_vary on;
  gzip_proxied any;

  # Timeouts proxy globaux
  proxy_connect_timeout 10s;
  proxy_send_timeout    30s;
  proxy_read_timeout    120s;

  # Réponses d'erreur JSON quand le backend est indisponible
  # Le frontend détecte correctement ces codes HTTP et affiche un message approprié.
  error_page 502 = @backend_unavailable;
  error_page 503 = @backend_unavailable;
  error_page 504 = @backend_unavailable;

  location @backend_unavailable {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"detail":"Service temporairement indisponible. Le backend démarre peut-être encore. Réessayez dans quelques secondes.","status":"starting"}';
  }

  location ~ ^/(health|auth|dashboard|municipalities|contacts|events|logs|external|public|api|supervision|operations|map|agents)(/|$) {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    # Intercepter les erreurs backend pour retourner JSON au lieu de HTML
    proxy_intercept_errors on;
  }

  location ~ ^/(docs|openapi.json|redoc)$ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
  }

  location = /map/annotations/stream {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "no-cache" always;
  }

  location = /external/isere/risks/stream {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "no-cache" always;
  }

  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location ~* \.(js|css)$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri $uri/ /index.html;
  }
}
