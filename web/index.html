<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRISIS38 - Refonte</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container">
    <section id="auth" class="card">
      <h1>CRISIS38</h1>
      <p>Connexion au centre opérationnel Isère.</p>
      <form id="login-form">
        <input name="username" placeholder="Utilisateur" value="admin" required />
        <input name="password" type="password" placeholder="Mot de passe" value="admin" required />
        <button>Se connecter</button>
      </form>
      <p id="login-error" class="error"></p>
    </section>

    <section id="app" class="hidden">
      <header class="card row">
        <div>
          <h2>Situation opérationnelle</h2>
          <p id="meta"></p>
        </div>
        <div>
          <button id="refresh">Rafraîchir les sources</button>
          <button id="logout" class="secondary">Déconnexion</button>
        </div>
      </header>

      <section class="grid">
        <article class="card">
          <h3>Sources externes</h3>
          <ul id="sources"></ul>
        </article>
        <article class="card">
          <h3>Communes</h3>
          <form id="city-form" class="inline-form">
            <input name="name" placeholder="Nom de commune" required />
            <input name="insee" placeholder="Code INSEE" />
            <button>Ajouter</button>
          </form>
          <ul id="cities"></ul>
        </article>
      </section>
    </section>
  </main>
  <script src="/script.js"></script>
</body>
</html>
